name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37 SDK
        shell: bash
        run: |
          sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [[ -z "${sdkmanager_path}" ]]; then
            echo "sdkmanager not found under ${ANDROID_HOME}/cmdline-tools" >&2
            exit 1
          fi
          yes | "${sdkmanager_path}" --licenses >/dev/null 2>&1 || true
          "${sdkmanager_path}" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build APKs
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Save APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aipospasswordmanager-apks-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish unsigned APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "${apk_path}"
          gh release create "${GITHUB_REF_NAME}" "${apk_path}" \
            --title "AIPOS Password Manager ${GITHUB_REF_NAME}" \
            --notes "Unsigned Android APK for ${GITHUB_REF_NAME}."
